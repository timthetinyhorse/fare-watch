settings:
  database: "farewatch.db"
  cabins:
    - "business"
  passengers: 1
  trip_type: "return"
  return_stay_days: 14
  max_connections: 1
  
  # Scan window constraints for Summer
  search_months:
    - "2027-07"
    - "2027-08"

fx_to_gbp:
  GBP: 1.0
  USD: 0.78
  EUR: 0.85
  AED: 0.21

routes:
  - name: "Newcastle to San Francisco / Los Angeles to Newcastle"
    origin: "NCL"
    destination: "SFO"
    return_origin: "LAX"
    return_destination: "NCL"
