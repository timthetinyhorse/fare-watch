settings:
  database: "farewatch.db"
  cabins:
    - "business"
  passengers: 1
  trip_type: "return"
  return_stay_days: 14
  max_connections: 1

fx_to_gbp:
  GBP: 1.0
  USD: 0.78
  EUR: 0.85
  AED: 0.21

routes:
  # --- London Heathrow / West Coast US ---
  - name: "London Heathrow to San Francisco"
    origin: "LHR"
    destination: "SFO"

  - name: "San Francisco to London Heathrow"
    origin: "SFO"
    destination: "LHR"

  - name: "London Heathrow to Los Angeles"
    origin: "LHR"
    destination: "LAX"

  - name: "Los Angeles to London Heathrow"
    origin: "LAX"
    destination: "LHR"

  # --- Newcastle / West Coast US ---
  - name: "Newcastle to San Francisco"
    origin: "NCL"
    destination: "SFO"

  - name: "San Francisco to Newcastle"
    origin: "SFO"
    destination: "NCL"

  - name: "Newcastle to Los Angeles"
    origin: "NCL"
    destination: "LAX"

  - name: "Los Angeles to Newcastle"
    origin: "LAX"
    destination: "NCL"

  # --- Newcastle / Middle East ---
  - name: "Newcastle to Dubai"
    origin: "NCL"
    destination: "DXB"

  - name: "Dubai to Newcastle"
    origin: "DXB"
    destination: "NCL"

  - name: "Newcastle to Abu Dhabi"
    origin: "NCL"
    destination: "AUH"

  - name: "Abu Dhabi to Newcastle"
    origin: "AUH"
    destination: "NCL"
