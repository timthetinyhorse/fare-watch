name: Daily fare scan

on:
  schedule:
    - cron: "0 5 * * *"   # every day at 05:00 UTC (6am UK summer time)
  workflow_dispatch:       # adds a "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Scan fares
        env:
          DUFFEL_TOKEN: ${{ secrets.DUFFEL_TOKEN }}
        run: python scanner.py

      - name: Build report
        # Early on there may not be enough data for a report; don't fail the run.
        run: python analyse.py --out docs/index.html || echo "Report skipped"

      - name: Save history and report
        run: |
          git config user.name "fare-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Daily scan $(date -u +%F)" || echo "Nothing new to save"
          git push
