name: Daily Fare Watch Scan

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duffel-api pyyaml pandas streamlit plotly
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Fare Scanner
        env:
          DUFFEL_API_KEY: ${{ secrets.DUFFEL_API_KEY }}
        run: |
          python scanner.py

      - name: Run Analysis Report
        run: |
          python analyse.py --out docs/index.html || echo "Report skipped"

      - name: Commit and Push Changes
        run: |
          git config user.name "fare-watch-bot"
          git config user.email "bot@farewatch.local"
          git add .
          git commit -m "Daily scan $(date -u +'%Y-%m-%d')" || exit 0
          git pull --rebase origin main
          git push
